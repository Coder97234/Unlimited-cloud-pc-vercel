<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC-Free — Windows in your browser</title>
    <meta name="description" content="A Windows 10 desktop you open in a browser tab. Runs in Docker and is embedded right here." />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <div class="dt-root" id="dtRoot">
      <!-- the real machine, when one is configured -->
      <iframe
        id="dtFrame"
        hidden
        title="Windows desktop"
        allow="clipboard-read; clipboard-write; fullscreen"
        referrerpolicy="no-referrer"
        style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000"
      ></iframe>

      <!-- demo desktop chrome (hidden while a real VM is connected) -->
      <div id="dtChrome" style="position:absolute;inset:0">
        <div class="dt-wall" id="dtWall"></div>

        <div id="dtDesktop" style="position:absolute;inset:0">
          <div class="dt-icons">
            <div class="dt-icon" data-app="files" title="Double-click to open">
              <span class="glyph">🗂️</span><span class="label">This PC</span>
            </div>
            <div class="dt-icon" data-app="notepad">
              <span class="glyph">📝</span><span class="label">Notepad</span>
            </div>
            <div class="dt-icon" data-app="term">
              <span class="glyph">⌨️</span><span class="label">Terminal</span>
            </div>
            <div class="dt-icon" data-app="calc">
              <span class="glyph">🧮</span><span class="label">Calculator</span>
            </div>
            <div class="dt-icon" data-app="guide">
              <span class="glyph">🖥️</span><span class="label">Connect a real PC</span>
            </div>
          </div>
        </div>

        <!-- start menu -->
        <div class="dt-start" id="dtStart">
          <h4>Pinned</h4>
          <div class="dt-start-grid">
            <button class="dt-start-app" data-app="files"><span class="glyph">🗂️</span>This PC</button>
            <button class="dt-start-app" data-app="notepad"><span class="glyph">📝</span>Notepad</button>
            <button class="dt-start-app" data-app="term"><span class="glyph">⌨️</span>Terminal</button>
            <button class="dt-start-app" data-app="calc"><span class="glyph">🧮</span>Calculator</button>
            <button class="dt-start-app" data-app="settings"><span class="glyph">⚙️</span>Settings</button>
            <button class="dt-start-app" data-app="guide"><span class="glyph">🖥️</span>Connect a real PC</button>
            <button class="dt-start-app" data-app="about"><span class="glyph">ℹ️</span>About</button>
            <button class="dt-start-app" id="dtLock"><span class="glyph">🔒</span>Lock</button>
          </div>
          <div class="dt-start-foot">
            <span>Demo desktop · no VM connected</span>
            <span style="display:flex;gap:8px">
              <button id="dtOpen" hidden>Open in new tab</button>
              <button id="dtStop" onclick="location.reload()">Reload</button>
            </span>
          </div>
        </div>

        <!-- taskbar -->
        <div class="dt-taskbar">
          <button class="dt-tb-btn dt-start-orb" id="dtStartBtn" title="Start">
            <span class="glyph"><i></i><i></i><i></i><i></i></span>
          </button>
          <div id="dtTasks" style="display:flex;gap:4px"></div>
          <div class="dt-tray">
            <span class="pill" id="dtStatePill"><span class="dot demo" id="dtStateDot"></span><span id="dtState">demo desktop</span></span>
            <span class="clock" id="dtClock">--:--</span>
          </div>
        </div>
      </div>
    </div>

    <script src="desktop.js"></script>
  </body>
</html>
